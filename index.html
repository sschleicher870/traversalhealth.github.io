<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traversal Health</title>
<meta name="description" content="A physician-led oncology platform to take care of the most underserved patient populations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#000F50;
    --green:#1E6A23;
    --paper:#EEF1F5;
    --ink-soft:rgba(0,15,80,.68);
    --rule:rgba(0,15,80,.14);
  }

  *{box-sizing:border-box}

  html,body{margin:0;padding:0}

  body{
    background:var(--paper);
    color:var(--navy);
    font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    padding:clamp(1.75rem,5vw,4rem);
    gap:clamp(2.5rem,7vh,5rem);
  }

  .logo{display:inline-block;line-height:0}
  .logo img{
    display:block;
    width:clamp(190px,26vw,260px);
    height:auto;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  h1{
    font-family:"Newsreader",Georgia,serif;
    font-weight:300;
    font-size:clamp(2.1rem,5.4vw,4.25rem);
    line-height:1.14;
    letter-spacing:-.018em;
    max-width:21ch;
    margin:0;
    text-wrap:balance;
  }

  .ridge{
    width:104px;
    height:2px;
    background:var(--green);
    border:0;
    margin:clamp(1.75rem,4vh,2.75rem) 0 0;
  }

  footer{
    display:flex;
    flex-wrap:wrap;
    gap:clamp(1.5rem,6vw,5rem) clamp(2rem,8vw,7rem);
    align-items:flex-end;
    justify-content:space-between;
    border-top:1px solid var(--rule);
    padding-top:1.5rem;
    font-size:.9375rem;
    line-height:1.75;
  }

  address{font-style:normal;color:var(--ink-soft)}

  .contact{display:flex;flex-wrap:wrap;gap:1.5rem clamp(2rem,8vw,7rem)}

  a.mail{
    color:var(--navy);
    font-weight:500;
    text-decoration:none;
    border-bottom:1px solid var(--green);
    padding-bottom:1px;
  }
  a.mail:hover{color:var(--green)}

  a:focus-visible,.logo:focus-visible{
    outline:2px solid var(--green);
    outline-offset:4px;
    border-radius:2px;
  }

  .copyright{color:var(--ink-soft);font-size:.8125rem}

  @media (max-width:640px){
    footer{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>

  <header>
    <a class="logo" href="/">
      <img src="logo.png" alt="Traversal Health" width="1294" height="202">
    </a>
  </header>

  <main>
    <h1>A physician-led oncology platform to take care of the most underserved patient populations.</h1>
    <hr class="ridge">
  </main>

  <footer>
    <div class="contact">
      <p style="margin:0"><a class="mail" href="mailto:inquiries@traversalhealth.com">inquiries@traversalhealth.com</a></p>
      <address>
        1005 17th Ave S, Suite 900<br>
        Nashville, TN 37212
      </address>
    </div>
    <p class="copyright">© 2026 Traversal Health</p>
  </footer>

</body>
</html>
